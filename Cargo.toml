[workspace]
resolver = "2"
members = ["app-*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
app-common = { path = "app-common", version = "*" }

[workspace.lints.rust]
unsafe_code = "deny"
future-incompatible = "forbid"

[profile.release]
opt-level = 's'
lto = true
codegen-units = 1
panic = 'abort'
